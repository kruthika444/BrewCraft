<div class="payment-method" data-bind="css: {'_active': (getCode() == isChecked())}">

    <div class="payment-method-title field choice">

        <input type="radio" name="payment[method]" class="radio" data-bind="
                    attr: {
                        id: getCode()
                    },
                    value: getCode(),
                    checked: isChecked,
                    click: selectPaymentMethod,
                    visible: isRadioButtonVisible()
               " />

        <label class="label" data-bind="attr: {for: getCode()}">

            <span data-bind="text: getTitle()"></span>

        </label>

    </div>

    <div class="payment-method-content">

        <div class="payment-method-note">
            Pay securely using Razorpay.
        </div>

        <div class="checkout-billing-address">
            <!-- ko foreach: $parent.getRegion(
                getBillingAddressFormName()
            ) -->
            <!-- ko template: getTemplate() -->
            <!-- /ko -->
            <!-- /ko -->
        </div>

        <div class="actions-toolbar">

            <div class="primary">

                <button class="action primary checkout" type="button" data-bind="
            click: startRazorpayPayment,
            enable: (
                getCode() == isChecked()
            ),
            attr: {
                title: $t('Pay with Razorpay')
            }
        ">

                    <span data-bind="i18n: 'Pay with Razorpay'"></span>

                </button>

            </div>

        </div>

    </div>

</div>
